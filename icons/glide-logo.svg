<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Warm accent gradient aligned with Glide's #c9a96e palette -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc291"/>
      <stop offset="50%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#a8854a"/>
    </linearGradient>

    <!-- Subtle radial glow behind the mark -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1816"/>
      <stop offset="100%" stop-color="#0d0c0b"/>
    </radialGradient>
  </defs>

  <!-- Background circle — warm dark -->
  <circle cx="256" cy="256" r="256" fill="url(#bg-glow)"/>

  <!--
    The mark: a single continuous stroke that forms a stylised "G"
    ending in a fluid upward sweep — evoking "glide".

    Anatomy:
    1. Arc opens from top-right, sweeps counter-clockwise ~270°
    2. The horizontal crossbar enters the counter
    3. The stroke lifts upward in a smooth taper — the "glide" gesture
  -->
  <path
    d="
      M 310 148
      C 278 112, 218 104, 176 132
      C 134 160, 116 214, 124 264
      C 132 314, 168 358, 220 374
      C 272 390, 322 362, 346 318
      C 358 296, 360 270, 352 248
      L 262 248
      C 262 248, 280 248, 296 232
      Q 320 208, 340 172
      Q 350 150, 356 120
    "
    stroke="url(#glow)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Accent dot — the finishing touch, a small warm circle at the sweep's tip -->
  <circle cx="356" cy="120" r="10" fill="#c9a96e" opacity="0.9"/>
</svg>

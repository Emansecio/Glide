<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Glide">
  <!--
    Glide mark — symbols only, no plate background.
    Center hub + 4 primary rays + 4 secondary rays.
  -->
  <defs>
    <linearGradient id="mark" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#f0ebe3"/>
      <stop offset="55%" stop-color="#e8d4c4"/>
      <stop offset="100%" stop-color="#d4713a"/>
    </linearGradient>
  </defs>

  <g transform="translate(256 256)" fill="url(#mark)">
    <circle r="42"/>
    <!-- Primary rays (N E S W) -->
    <path d="M0 -78 L18 -118 L0 -210 L-18 -118 Z"/>
    <path d="M78 0 L118 18 L210 0 L118 -18 Z"/>
    <path d="M0 78 L18 118 L0 210 L-18 118 Z"/>
    <path d="M-78 0 L-118 18 L-210 0 L-118 -18 Z"/>
    <!-- Secondary rays (diagonals) -->
    <g transform="rotate(45)">
      <path d="M0 -72 L12 -100 L0 -158 L-12 -100 Z"/>
      <path d="M72 0 L100 12 L158 0 L100 -12 Z"/>
      <path d="M0 72 L12 100 L0 158 L-12 100 Z"/>
      <path d="M-72 0 L-100 12 L-158 0 L-100 -12 Z"/>
    </g>
  </g>
</svg>

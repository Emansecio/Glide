<main class="main-content">
    <div id="chatInterface" class="chat-area">
        <div id="agentNav" class="agent-nav hidden">
            <div class="agent-nav-item main-agent active" data-agent="main">
                <span class="agent-status"></span>
                <span>Principal</span>
            </div>
        </div>

        <div id="chatEmptyState" class="chat-empty-state">
            <div class="chat-empty-orb"></div>
            <div class="chat-empty-title">Pronto quando você estiver</div>
            <div class="chat-empty-subtitle">Pergunte algo, adicione abas ou arquivos para começar a conversa.</div>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <button id="scrollToLatestBtn" class="jump-to-latest hidden">Ir para o fim</button>

        <aside id="activityPanel" class="activity-panel" aria-hidden="true">
            <div class="activity-panel-header">
                <span class="activity-panel-title">Atividade</span>
                <div class="activity-panel-actions">
                    <button id="exportExecutionLogBtn" class="activity-export-btn" title="Exportar log de execucao">
                        Exportar log
                    </button>
                    <button id="activityCloseBtn" class="icon-btn" title="Fechar atividade">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="activity-panel-block">
                <div class="activity-panel-label">Raciocínio</div>
                <pre id="thinkingPanel" class="thinking-panel empty">Sem raciocínio capturado ainda.</pre>
            </div>
            <div class="activity-panel-block">
                <div class="activity-panel-label">Ferramentas</div>
                <div id="toolLog" class="tool-log"></div>
            </div>
        </aside>

        <div id="planDrawer" class="plan-drawer hidden">
            <div class="plan-drawer-header" id="planDrawerToggle">
                <div class="plan-drawer-title">
                    <svg class="plan-drawer-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                    <span>Plano</span>
                    <span class="plan-drawer-count" id="planStepCount">0 etapas</span>
                </div>
                <div class="plan-drawer-actions">
                    <button class="plan-drawer-btn" id="planClearBtn" title="Limpar plano">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="plan-drawer-content" id="planDrawerContent">
                <ol class="plan-checklist" id="planChecklist"></ol>
            </div>
        </div>

        <div class="composer-wrapper">
            <div id="selectedTabsBar" class="selected-tabs hidden"></div>
            <div id="composer" class="composer">
                <div class="composer-context-tools">
                    <button id="fileBtn" class="icon-btn tool-item" title="Anexar arquivo">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21.44 11.05 12.36 20.12a5 5 0 0 1-7.07-7.07l8.49-8.49a3 3 0 0 1 4.24 4.24L9.76 17.12a1 1 0 0 1-1.41-1.41l7.07-7.07" />
                        </svg>
                    </button>
                    <input id="fileInput" type="file" multiple accept=".md,.txt,.csv,.json,.log" class="hidden" />

                    <button id="tabSelectorBtn" class="icon-btn tool-item" title="Abas do navegador">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <line x1="3" y1="9" x2="21" y2="9" />
                            <line x1="9" y1="21" x2="9" y2="9" />
                        </svg>
                    </button>
                </div>
                <textarea id="userInput" placeholder="Mensagem..." rows="1"></textarea>

                <div class="composer-toolbar">
                    <div class="composer-actions-left">
                        <button id="openSidebarBtn" class="icon-btn action-item" title="Menu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="12" x2="21" y2="12" />
                                <line x1="3" y1="6" x2="21" y2="6" />
                                <line x1="3" y1="18" x2="21" y2="18" />
                            </svg>
                        </button>
                        <button id="activityToggleBtn" class="icon-btn action-item activity-toggle" title="Painel de Atividade">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="4 17 10 11 4 5" />
                                <line x1="12" y1="19" x2="20" y2="19" />
                            </svg>
                        </button>
                    </div>

                    <div class="composer-meta">
                        <div id="statusBar" class="status-bar">
                            <span id="statusDot" class="status-dot"></span>
                            <span id="statusText">Pronto</span>
                            <span id="statusMeta" class="status-meta"></span>
                        </div>
                    </div>

                    <div class="composer-actions-right">
                        <div class="model-picker">
                            <button id="modelSelectTrigger" class="model-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                                <span id="modelSelectValue">Selecionar modelo</span>
                                <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="6 9 12 15 18 9" />
                                </svg>
                            </button>
                            <select id="modelSelect" class="hidden" tabindex="-1" aria-hidden="true"></select>
                            <div id="modelSelectMenu" class="model-dropdown hidden" role="listbox"></div>
                        </div>

                        <button id="sendBtn" class="send-action" title="Enviar Mensagem">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

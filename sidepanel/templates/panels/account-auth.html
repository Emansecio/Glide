<section id="authPanel" class="access-card">
    <div class="panel-header">
        <span class="panel-title">Entrar</span>
    </div>
    <p id="authSubtitle" class="text-muted">Entre com e-mail para habilitar cobrança e recursos de conta.</p>

    <div id="accessConfigPrompt" class="access-banner hidden">
        <span>Defina a URL da Account API em Configurações primeiro.</span>
        <button id="authOpenSettingsBtn" class="btn btn-secondary" type="button">Abrir configurações</button>
    </div>

    <form id="authForm" class="access-form">
        <div class="form-group">
            <label for="authEmail">E-mail</label>
            <input id="authEmail" type="email" placeholder="voce@exemplo.com" autocomplete="email" required />
        </div>
        <div class="form-row">
            <button id="authStartBtn" class="btn btn-primary" type="submit">Enviar link de acesso</button>
            <button id="authOpenBtn" class="btn btn-secondary" type="button">Abrir conta</button>
        </div>
    </form>

    <div class="divider">ou</div>

    <div class="form-group">
        <label for="authTokenInput">Token de acesso</label>
        <input id="authTokenInput" type="password" placeholder="Cole seu token" />
        <button id="authTokenSaveBtn" class="btn btn-secondary" type="button">Usar token</button>
    </div>
</section>

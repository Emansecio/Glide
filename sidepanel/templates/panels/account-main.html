<section id="accountPanel" class="access-card hidden">
    <div class="panel-header">
        <span id="accountGreeting">Bem-vindo</span>
        <button id="accountRefreshBtn" class="btn btn-secondary" type="button">Atualizar</button>
    </div>

    <p id="accountSubtext" class="text-muted">Gerencie assinatura, cobrança e atalhos de conta.</p>

    <div class="account-grid">
        <div class="account-card">
            <div class="card-title">Assinatura</div>
            <div id="accountPlanStatus" class="text-muted">Nenhum plano ativo</div>
            <span id="accountPlanBadge" class="plan-pill">Plano</span>
            <div id="accountPlanDetails" class="text-muted"></div>
            <div class="form-row">
                <button id="accountCheckoutBtn" class="btn btn-primary" type="button">Assinar</button>
                <button id="accountPortalBtn" class="btn btn-secondary" type="button">Cobrança</button>
            </div>
        </div>

        <div class="account-card">
            <div class="card-title">Resumo de cobrança</div>
            <div id="accountBillingSummary" class="text-muted">Sem detalhes de cobrança.</div>
            <div id="accountInvoices" class="account-list"></div>
        </div>

        <div class="account-card">
            <div class="card-title">Configurações</div>
            <div id="accountSettingsSummary" class="text-muted">Revise perfis, permissões e integrações.</div>
            <button id="accountOpenSettingsBtn" class="btn btn-secondary" type="button">Abrir configurações</button>
        </div>

        <div class="account-card">
            <div class="card-title">Perfis</div>
            <div id="accountConfigs" class="account-list"></div>
            <button id="accountOpenProfilesBtn" class="btn btn-secondary" type="button">Abrir perfis</button>
        </div>

        <div class="account-card">
            <div class="card-title">Histórico</div>
            <div id="accountHistory" class="account-list"></div>
            <button id="accountOpenHistoryBtn" class="btn btn-secondary" type="button">Ver histórico</button>
        </div>
    </div>

    <button id="accountLogoutBtn" class="btn btn-secondary" type="button">Sair</button>
</section>

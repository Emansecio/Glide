<div id="historyPanel" class="right-panel-content hidden" data-panel="history">
    <div class="panel-header">
        <span class="panel-title">Histórico</span>
        <div class="panel-header-actions">
            <button id="privateSessionBtn" class="btn btn-secondary" title="Nova conversa sem gravar histórico">Sessão privada</button>
            <button id="clearHistoryBtn" class="btn btn-secondary" title="Limpar histórico">Limpar</button>
            <button id="startNewSessionBtn" class="btn btn-primary">Nova conversa</button>
        </div>
    </div>
    <div id="historyItems" class="history-items"></div>
</div>

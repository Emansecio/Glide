<div id="settingsTabGeneral" class="tab-panel" data-tab="general">
    <div class="settings-quick-setup">
        <h3 class="setup-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path
                    d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
            </svg>
            Configuracao
        </h3>

        <div class="form-group">
            <label for="provider">Provedor</label>
            <select id="provider">
                <option value="anthropic" selected>Claude Code (OAuth / Anthropic)</option>
                <option value="codex">Codex (OpenAI)</option>
                <option value="opencode">OpenCode Zen</option>
                <option value="ollama">Ollama (local)</option>
            </select>
        </div>

        <div class="form-group" id="apiKeyGroup">
            <label for="apiKey" id="apiKeyLabel">Token OAuth do Claude Code</label>
            <input type="password" id="apiKey" placeholder="Cole seu token OAuth do Claude Code..." />
            <small id="apiKeyHint">Seu token OAuth obtido em ~/.claude/.credentials.json ou Keychain.</small>
            <div class="oauth-helper-actions">
                <button type="button" id="codexOauthBtn" class="btn btn-secondary btn-sm oauth-helper-btn hidden">
                    🔐 Conectar via navegador
                </button>
                <button type="button" id="importCredentialsBtn" class="btn btn-secondary btn-sm oauth-helper-btn">
                    📂 Importar credenciais
                </button>
                <button type="button" id="oauthHelpBtn" class="btn btn-secondary btn-sm oauth-helper-btn">
                    ❓ Como Obter?
                </button>
                <input type="file" id="credentialsFileInput" accept=".json" class="hidden" />
            </div>
        </div>

        <div class="form-group hidden" id="customEndpointGroup">
            <label for="customEndpoint" id="customEndpointLabel">Endpoint da API</label>
            <input type="text" id="customEndpoint" placeholder="http://localhost:11434" />
            <small id="endpointHint">Deixe vazio para usar o endpoint padrão do provedor.</small>
        </div>

        <div class="form-group">
            <label for="model">Modelo</label>
            <input type="text" id="model" placeholder="Ex: claude-sonnet-5" />
            <small id="modelHint">Nome do modelo na Anthropic (ex: claude-sonnet-5, claude-opus-4-8).</small>
            <div class="oauth-helper-actions hidden" id="detectModelsGroup">
                <button type="button" id="detectModelsBtn" class="btn btn-secondary btn-sm oauth-helper-btn oauth-helper-btn--full">
                    🔍 Detectar modelos disponíveis
                </button>
            </div>
        </div>

        <div class="settings-actions">
            <button id="saveSettingsBtn" class="btn btn-primary">Salvar</button>
            <button id="cancelSettingsBtn" class="btn btn-secondary">Cancelar</button>
        </div>
    </div>

    <details class="settings-section">
        <summary>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            Prompt do sistema
        </summary>
        <div class="settings-body">
            <div class="form-group">
                <label for="systemPrompt">Prompt customizado</label>
                <textarea id="systemPrompt" rows="8" placeholder="Deixe vazio para usar o padrao..."></textarea>
            </div>
        </div>
    </details>
</div>

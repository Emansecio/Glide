<div id="settingsTabProfiles" class="tab-panel hidden" data-tab="profiles">
    <div class="profile-actions-row">
        <input id="newProfileNameInput" type="text" placeholder="Nome do perfil" />
        <button id="createProfileBtn" class="btn btn-primary" type="button">Criar</button>
        <button id="openGeneralBtn" class="btn btn-secondary" type="button">Voltar para geral</button>
        <button id="refreshProfilesBtn" class="btn btn-secondary" type="button">Atualizar</button>
    </div>

    <div id="agentGrid" class="agent-grid"></div>

    <div id="profileEditor" class="profile-editor">
        <div class="panel-header">
            <span id="profileEditorTitle">Editando: default</span>
        </div>

        <div class="profile-editor-grid">
            <div class="form-group">
                <label for="profileEditorName">Nome</label>
                <input type="text" id="profileEditorName" readonly />
            </div>

            <div class="form-group">
                <label for="profileEditorProvider">Provedor</label>
                <select id="profileEditorProvider">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="google">Google</option>
                    <option value="ollama">Ollama</option>
                    <option value="kimi">Kimi</option>
                    <option value="custom">Customizado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="profileEditorApiKey">Chave de API</label>
                <input type="password" id="profileEditorApiKey" placeholder="sk-..." />
            </div>

            <div class="form-group">
                <label for="profileEditorModel">Modelo</label>
                <input type="text" id="profileEditorModel" placeholder="gpt-4o" />
            </div>

            <div class="form-group" id="profileEditorEndpointGroup" style="display: none">
                <label for="profileEditorEndpoint">Endpoint</label>
                <input type="text" id="profileEditorEndpoint" placeholder="https://..." />
            </div>

            <div class="form-group">
                <label for="profileEditorTemperature">Temperatura: <span id="profileEditorTemperatureValue">0.7</span></label>
                <input type="range" id="profileEditorTemperature" min="0" max="2" step="0.1" value="0.7" />
            </div>

            <div class="form-group">
                <label for="profileEditorMaxTokens">Máximo de tokens</label>
                <input type="number" id="profileEditorMaxTokens" min="1" max="32000" value="2048" />
            </div>

            <div class="form-group">
                <label for="profileEditorTimeout">Timeout (ms)</label>
                <input type="number" id="profileEditorTimeout" min="5000" step="1000" value="30000" />
            </div>

            <div class="form-group">
                <label for="profileEditorEnableScreenshots">Capturas de tela</label>
                <select id="profileEditorEnableScreenshots">
                    <option value="false">Desativado</option>
                    <option value="true">Ativado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="profileEditorSendScreenshots">Enviar como</label>
                <select id="profileEditorSendScreenshots">
                    <option value="true">Imagem</option>
                    <option value="false">Texto</option>
                </select>
            </div>

            <div class="form-group">
                <label for="profileEditorScreenshotQuality">Qualidade</label>
                <select id="profileEditorScreenshotQuality">
                    <option value="high">Alta</option>
                    <option value="low">Baixa</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="profileEditorPrompt">Prompt do sistema</label>
                <textarea id="profileEditorPrompt" rows="4"></textarea>
            </div>
        </div>

        <button id="saveProfileBtn" class="btn btn-primary" type="button">Salvar perfil</button>
    </div>
</div>

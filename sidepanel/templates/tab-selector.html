<div id="tabSelector" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content tab-selector-modal">
        <div class="modal-header">
            <div class="modal-title-block">
                <div class="modal-title-row">
                    <span class="modal-title">Adicionar contexto de abas</span>
                    <span id="tabSelectorSummary" class="tab-selector-summary">Nenhuma aba selecionada</span>
                </div>
                <div class="modal-subtitle">As abas selecionadas adicionam títulos e URLs ao prompt para melhorar o contexto.</div>
            </div>
            <button id="closeTabSelector" class="icon-btn" title="Fechar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="tab-selector-actions">
            <button id="tabSelectorAddActive" class="btn btn-primary">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Adicionar aba ativa
            </button>
            <button id="tabSelectorClear" class="btn btn-secondary">Limpar</button>
        </div>
        <div class="tab-selector-hint">Dica: use grupos de abas para selecionar contextos completos.</div>
        <div id="tabList" class="tab-list"></div>
    </div>
</div>

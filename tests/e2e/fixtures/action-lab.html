<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontier action lab</title>
  </head>
  <body>
    <main>
      <button id="action-button" type="button">Run action</button>
      <button id="delayed-action-button" type="button">Run delayed action</button>
      <label for="action-input">Action input</label>
      <input id="action-input" name="actionInput" />
      <label><input id="action-checkbox" type="checkbox" /> Action checkbox</label>
      <div id="action-hover" tabindex="0">Hover target</div>
      <form id="action-form">
        <button id="action-submit" type="submit">Submit action</button>
      </form>
      <button id="spa-action" type="button">Open SPA route</button>
      <div id="shadow-host"></div>
      <dialog id="action-dialog">Shadow action completed</dialog>
    </main>
    <script>
      window.__actionLab = {
        click: 0,
        delayedMutation: 0,
        input: 0,
        change: 0,
        submit: 0,
        hover: 0,
        checkboxClick: 0,
        checkbox: false,
        spaNavigation: 0,
        shadowClick: 0,
        dialogOpen: 0,
      };

      const shadowRoot = document.getElementById('shadow-host').attachShadow({ mode: 'open' });
      shadowRoot.innerHTML = '<button id="shadow-action" type="button">Open shadow dialog</button>';
      shadowRoot.getElementById('shadow-action').addEventListener('click', () => {
        window.__actionLab.shadowClick += 1;
        document.getElementById('action-dialog').showModal();
        window.__actionLab.dialogOpen += 1;
      });

      document.getElementById('action-button').addEventListener('click', () => {
        window.__actionLab.click += 1;
      });
      document.getElementById('delayed-action-button').addEventListener('click', () => {
        setTimeout(() => {
          window.__actionLab.delayedMutation += 1;
        }, 8250);
      });
      document.getElementById('action-input').addEventListener('input', () => {
        window.__actionLab.input += 1;
      });
      document.getElementById('action-input').addEventListener('change', () => {
        window.__actionLab.change += 1;
      });
      document.getElementById('action-form').addEventListener('submit', (event) => {
        event.preventDefault();
        window.__actionLab.submit += 1;
      });
      document.getElementById('action-hover').addEventListener('mouseenter', () => {
        window.__actionLab.hover += 1;
      });
      document.getElementById('action-checkbox').addEventListener('click', () => {
        window.__actionLab.checkboxClick += 1;
      });
      document.getElementById('action-checkbox').addEventListener('change', (event) => {
        window.__actionLab.change += 1;
        window.__actionLab.checkbox = event.currentTarget.checked;
      });
      document.getElementById('spa-action').addEventListener('click', () => {
        window.__actionLab.spaNavigation += 1;
        history.pushState({ fixture: true }, '', '/action-lab.html?route=details');
      });
    </script>
  </body>
</html>
